[package]
name = "factorio-science-planner"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob", "CanvasGradient", "CanvasRenderingContext2d", "Clipboard", "CssStyleDeclaration",
    "Document", "Element", "File", "FileList", "HtmlCanvasElement", "HtmlElement", "HtmlImageElement",
    "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Navigator", "PointerEvent",
    "ResizeObserver", "Url", "Window",
] }
yew = { version = "0.23", features = ["csr"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
lto = true
opt-level = "s"
